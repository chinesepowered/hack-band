[project]
name = "capybargain"
version = "0.1.0"
description = "A purchasing department run by AI capybaras, built on Band"
requires-python = ">=3.11"
dependencies = [
    "band-sdk>=5.1.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
